<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background:#0a1628;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2942" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0b1d30" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Header -->
  <g transform="translate(60, 40)">
    <rect width="44" height="44" rx="12" fill="url(#primaryGrad)" filter="url(#glow)" />
    <path d="M16 28 c3 0 5-3 5-6 0-2-1-3-2-4s-3-4-3-6c-.5 2-1.5 3-2.5 5S11 20 11 22c0 3 2 6 5 6z" fill="#ffffff" />
    <text x="60" y="28" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="-0.5">LoopSight v2</text>
    <text x="60" y="44" fill="#8aa0c0" font-size="12" font-weight="500">Uncertainty-Triggered OpenCV 5 Active-Perception &amp; MCP Vision Architecture</text>
    <rect x="780" y="8" width="300" height="32" rx="16" fill="#0f2942" stroke="#1e3a5f" />
    <circle cx="800" cy="24" r="5" fill="#22c55e" />
    <text x="814" y="28" fill="#7dd3fc" font-size="12" font-weight="600">OpenCV 5.0.0 · AWS Lambda ARM64 · MCP 1.0</text>
  </g>

  <!-- Stage 1: Input & Pre-flight Gate -->
  <g transform="translate(60, 110)">
    <rect width="320" height="230" rx="16" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="42" rx="16" fill="#133454" />
    <text x="18" y="26" fill="#38bdf8" font-size="13" font-weight="700">1. INPUT &amp; CLIENT PRE-FLIGHT GATE</text>
    
    <g transform="translate(18, 56)">
      <rect width="284" height="42" rx="8" fill="#0a1628" stroke="#1e3a5f" />
      <text x="14" y="20" fill="#ffffff" font-size="12" font-weight="600">Client Pre-Flight Quality Gate</text>
      <text x="14" y="34" fill="#8aa0c0" font-size="10">Checks min-res, local contrast &gt; 0.05, glare &lt; 40%</text>

      <rect y="50" width="284" height="54" rx="8" fill="#0a1628" stroke="#1e3a5f" />
      <text x="14" y="16" fill="#ffffff" font-size="12" font-weight="600" transform="translate(0, 50)">1-Click OpenCV 5 Benchmark Bench</text>
      <text x="14" y="32" fill="#8aa0c0" font-size="10" transform="translate(0, 50)">6 Physics Scenarios: Glass Glare, Sediment Settling,</text>
      <text x="14" y="44" fill="#8aa0c0" font-size="10" transform="translate(0, 50)">Ambient-Backlight, High-Turbidity, Crack Shadows</text>

      <rect y="112" width="284" height="48" rx="8" fill="#0a1628" stroke="#1e3a5f" />
      <text x="14" y="16" fill="#ffffff" font-size="12" font-weight="600" transform="translate(0, 112)">Offline PWA Field Capability</text>
      <text x="14" y="32" fill="#8aa0c0" font-size="10" transform="translate(0, 112)">Local canvas inspection &amp; worker request caching</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(380, 220)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
    <polygon points="50,0 42,-5 42,5" fill="#38bdf8" />
    <text x="4" y="-8" fill="#7dd3fc" font-size="10" font-weight="600">POST /inspect</text>
  </g>

  <!-- Stage 2: Pass 1 Deterministic OpenCV 5 Metrology -->
  <g transform="translate(440, 110)">
    <rect width="330" height="230" rx="16" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.5" />
    <rect x="0" y="0" width="330" height="42" rx="16" fill="#133454" />
    <text x="18" y="26" fill="#38bdf8" font-size="13" font-weight="700">2. PASS 1 DETERMINISTIC METROLOGY</text>

    <g transform="translate(18, 56)">
      <rect width="294" height="48" rx="8" fill="#0a1628" stroke="#1e3a5f" />
      <text x="12" y="18" fill="#ffffff" font-size="12" font-weight="600">water_turbidity_v1 (Nephelometry)</text>
      <text x="12" y="34" fill="#8aa0c0" font-size="10">cv2.findChessboardCorners (FAST_CHECK) + Secchi contrast</text>

      <rect y="54" width="294" height="48" rx="8" fill="#0a1628" stroke="#1e3a5f" />
      <text x="12" y="18" fill="#ffffff" font-size="12" font-weight="600" transform="translate(0, 54)">structural_crack_metrology_v1</text>
      <text x="12" y="34" fill="#8aa0c0" font-size="10" transform="translate(0, 54)">bilateralFilter + MORPH_BLACKHAT + distanceTransform (mm)</text>

      <rect y="108" width="294" height="50" rx="8" fill="#0a1628" stroke="#1e3a5f" />
      <text x="12" y="18" fill="#ffffff" font-size="12" font-weight="600" transform="translate(0, 108)">Physical Confounder Telemetry</text>
      <text x="12" y="32" fill="#7dd3fc" font-size="10" transform="translate(0, 108)">glare_ratio · skew_deg · stratification_delta · contrast</text>
      <text x="12" y="44" fill="#22c55e" font-size="10" font-weight="600" transform="translate(0, 108)">Beer-Lambert NTU: NTU = 3.5 * (1/vis - 1)^1.15</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(770, 220)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#f59e0b" stroke-width="2" />
    <polygon points="50,0 42,-5 42,5" fill="#f59e0b" />
    <text x="4" y="-8" fill="#f59e0b" font-size="10" font-weight="700">UNCERTAIN</text>
  </g>

  <!-- Fast Path Pass 1 -> Verdict -->
  <g transform="translate(605, 340)">
    <path d="M0 0 L0 390 L215 390" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="4 4" />
    <polygon points="215,390 207,385 207,395" fill="#22c55e" />
    <text x="12" y="150" fill="#22c55e" font-size="11" font-weight="700" transform="rotate(90 12,150)">CONFIDENT PASS / FAIL (0 Agent Calls)</text>
  </g>

  <!-- Stage 3: Bounded Agent & MCP 8-Tool Registry -->
  <g transform="translate(830, 110)">
    <rect width="310" height="230" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="310" height="42" rx="16" fill="#452705" />
    <text x="18" y="26" fill="#fcd34d" font-size="13" font-weight="700">3. AGENTIC VISION &amp; MCP REGISTRY</text>

    <g transform="translate(14, 56)">
      <rect width="282" height="48" rx="8" fill="#0a1628" stroke="#f59e0b" stroke-opacity="0.4" />
      <text x="10" y="18" fill="#ffffff" font-size="11" font-weight="600">Double-Enforced 8-Tool Whitelist</text>
      <text x="10" y="32" fill="#8aa0c0" font-size="10">Gemini 3.6 Flash bounded selector + 15s timeout</text>

      <rect y="54" width="282" height="52" rx="8" fill="#0a1628" stroke="#1e3a5f" />
      <text x="10" y="16" fill="#38bdf8" font-size="11" font-weight="600" transform="translate(0, 54)">Composite Active Perception DAGs</text>
      <text x="10" y="30" fill="#ffffff" font-size="10" transform="translate(0, 54)">Chains multiple sequential OpenCV tools:</text>
      <text x="10" y="44" fill="#7dd3fc" font-size="10" font-family="monospace" transform="translate(0, 54)">inpaint_glare -&gt; rectify_homography</text>

      <rect y="112" width="282" height="48" rx="8" fill="#0a1628" stroke="#1e3a5f" />
      <text x="10" y="18" fill="#ffffff" font-size="11" font-weight="600" transform="translate(0, 112)">Model Context Protocol (POST /mcp/rpc)</text>
      <text x="10" y="32" fill="#8aa0c0" font-size="10">Standard JSON-RPC 2.0 (tools/list &amp; tools/call)</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 (Downwards) -->
  <g transform="translate(985, 340)">
    <line x1="0" y1="0" x2="0" y2="70" stroke="#f59e0b" stroke-width="2" />
    <polygon points="0,70 -5,62 5,62" fill="#f59e0b" />
    <text x="8" y="40" fill="#fcd34d" font-size="10" font-weight="600">Dispatches CV Tool / DAG</text>
  </g>

  <!-- Stage 4: 8 OpenCV 5 Active-Perception Tools (Middle Layer) -->
  <g transform="translate(60, 420)">
    <rect width="1080" height="150" rx="16" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.5" />
    <rect x="0" y="0" width="1080" height="36" rx="16" fill="#133454" />
    <text x="18" y="24" fill="#38bdf8" font-size="13" font-weight="700">4. THE 8 WHITELISTED OPENCV 5 ACTIVE-PERCEPTION TOOLS (cv/tools.py &amp; /mcp/tools)</text>

    <g transform="translate(18, 48)">
      <g transform="translate(0, 0)">
        <rect width="250" height="40" rx="6" fill="#0a1628" stroke="#1e3a5f" />
        <text x="10" y="16" fill="#38bdf8" font-size="11" font-weight="600">inpaint_specular_glare</text>
        <text x="10" y="30" fill="#8aa0c0" font-size="9">HSV glare mask + cv2.inpaint Telea + CLAHE</text>
      </g>
      <g transform="translate(265, 0)">
        <rect width="250" height="40" rx="6" fill="#0a1628" stroke="#1e3a5f" />
        <text x="10" y="16" fill="#38bdf8" font-size="11" font-weight="600">rectify_perspective_homography</text>
        <text x="10" y="30" fill="#8aa0c0" font-size="9">Quad corners + cv2.warpPerspective</text>
      </g>
      <g transform="translate(530, 0)">
        <rect width="250" height="40" rx="6" fill="#0a1628" stroke="#1e3a5f" />
        <text x="10" y="16" fill="#38bdf8" font-size="11" font-weight="600">analyze_vertical_stratification</text>
        <text x="10" y="30" fill="#8aa0c0" font-size="9">3-stratum supernatant vs sediment settling</text>
      </g>
      <g transform="translate(795, 0)">
        <rect width="250" height="40" rx="6" fill="#0a1628" stroke="#1e3a5f" />
        <text x="10" y="16" fill="#38bdf8" font-size="11" font-weight="600">skeletonize_crack_metrology</text>
        <text x="10" y="30" fill="#8aa0c0" font-size="9">Gaussian shadow removal + cv2.distanceTransform</text>
      </g>

      <g transform="translate(0, 48)">
        <rect width="250" height="40" rx="6" fill="#0a1628" stroke="#1e3a5f" />
        <text x="10" y="16" fill="#7dd3fc" font-size="11" font-weight="600">track_across_frames</text>
        <text x="10" y="30" fill="#8aa0c0" font-size="9">Multi-lighting fusion + phaseCorrelate shift</text>
      </g>
      <g transform="translate(265, 48)">
        <rect width="250" height="40" rx="6" fill="#0a1628" stroke="#1e3a5f" />
        <text x="10" y="16" fill="#7dd3fc" font-size="11" font-weight="600">reinspect_roi</text>
        <text x="10" y="30" fill="#8aa0c0" font-size="9">2x cv2.INTER_CUBIC bicubic super-sampling</text>
      </g>
      <g transform="translate(530, 48)">
        <rect width="250" height="40" rx="6" fill="#0a1628" stroke="#1e3a5f" />
        <text x="10" y="16" fill="#7dd3fc" font-size="11" font-weight="600">measure_edge_continuity</text>
        <text x="10" y="30" fill="#8aa0c0" font-size="9">Sensitive Canny (30, 100) re-evaluation</text>
      </g>
      <g transform="translate(795, 48)">
        <rect width="250" height="40" rx="6" fill="#0a1628" stroke="#1e3a5f" />
        <text x="10" y="16" fill="#7dd3fc" font-size="11" font-weight="600">compare_to_reference</text>
        <text x="10" y="30" fill="#8aa0c0" font-size="9">Histogram-equalized reference check</text>
      </g>
    </g>
  </g>

  <!-- Arrow 4 -> 5 (Downwards to Policy) -->
  <g transform="translate(985, 570)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#22c55e" stroke-width="2" />
    <polygon points="0,40 -5,32 5,32" fill="#22c55e" />
    <text x="8" y="24" fill="#86efac" font-size="10" font-weight="600">Pass 2 Evidence</text>
  </g>

  <!-- Stage 5: Deterministic Policy & Standards (Bottom Layer) -->
  <g transform="translate(60, 620)">
    <rect width="730" height="150" rx="16" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.5" />
    <rect x="0" y="0" width="730" height="36" rx="16" fill="#133454" />
    <text x="18" y="24" fill="#38bdf8" font-size="13" font-weight="700">5. DETERMINISTIC AUDITABLE POLICY (cv/policy.py)</text>

    <g transform="translate(18, 48)">
      <rect width="160" height="85" rx="8" fill="#064e3b" stroke="#059669" />
      <text x="12" y="22" fill="#34d399" font-size="13" font-weight="700">PASS</text>
      <text x="12" y="38" fill="#ffffff" font-size="10">vis &gt;= 0.55 / crack &lt; 0.16</text>
      <text x="12" y="52" fill="#a7f3d0" font-size="10">&lt; 5.0 NTU (WHO standard)</text>
      <text x="12" y="68" fill="#d1fae5" font-size="9">Disclaims: clear != safe</text>

      <rect x="175" y="0" width="160" height="85" rx="8" fill="#451a03" stroke="#d97706" />
      <text x="12" y="22" fill="#fbbf24" font-size="13" font-weight="700" transform="translate(175, 0)">REVIEW</text>
      <text x="12" y="38" fill="#ffffff" font-size="10" transform="translate(175, 0)">borderline 0.20..0.55</text>
      <text x="12" y="52" fill="#fde68a" font-size="10" transform="translate(175, 0)">Requests 2nd lighting /</text>
      <text x="12" y="68" fill="#fef3c7" font-size="9" transform="translate(175, 0)">certified lab test</text>

      <rect x="350" y="0" width="160" height="85" rx="8" fill="#4c0519" stroke="#e11d48" />
      <text x="12" y="22" fill="#f43f5e" font-size="13" font-weight="700" transform="translate(350, 0)">FAIL</text>
      <text x="12" y="38" fill="#ffffff" font-size="10" transform="translate(350, 0)">vis &lt;= 0.20 / crack &gt; 0.4mm</text>
      <text x="12" y="52" fill="#fecdd3" font-size="10" transform="translate(350, 0)">&gt; 15.0 NTU turbidity</text>
      <text x="12" y="68" fill="#ffe4e6" font-size="9" transform="translate(350, 0)">Actionable hazard flag</text>

      <rect x="525" y="0" width="170" height="85" rx="8" fill="#1e1e2e" stroke="#475569" />
      <text x="10" y="22" fill="#cbd5e1" font-size="11" font-weight="700" transform="translate(525, 0)">NO_PATTERN_DETECTED</text>
      <text x="10" y="38" fill="#ffffff" font-size="10" transform="translate(525, 0)">Responsible Refusal</text>
      <text x="10" y="52" fill="#94a3b8" font-size="9" transform="translate(525, 0)">Refuses verdict on invalid</text>
      <text x="10" y="66" fill="#94a3b8" font-size="9" transform="translate(525, 0)">or non-water images</text>
    </g>
  </g>

  <!-- Stage 6: Cloud Architecture & Persistence (Bottom Right) -->
  <g transform="translate(810, 620)">
    <rect width="330" height="150" rx="16" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.5" />
    <rect x="0" y="0" width="330" height="36" rx="16" fill="#133454" />
    <text x="18" y="24" fill="#38bdf8" font-size="13" font-weight="700">6. CLOUD ARCHITECTURE &amp; DATA</text>

    <g transform="translate(18, 48)">
      <text x="0" y="16" fill="#ffffff" font-size="11" font-weight="600">AWS Lambda ARM64 (Graviton Engine)</text>
      <text x="0" y="30" fill="#8aa0c0" font-size="10">Mangum adapter · Always-free tier · Function URLs</text>

      <text x="0" y="50" fill="#ffffff" font-size="11" font-weight="600">JobStore Persistence Layer</text>
      <text x="0" y="64" fill="#8aa0c0" font-size="10">SQLite write-through fallback + Decimal-safe DynamoDB</text>

      <text x="0" y="84" fill="#22c55e" font-size="11" font-weight="600">Proven Benchmark (+0.75 Benefit)</text>
      <text x="0" y="98" fill="#7dd3fc" font-size="10">Exp C (100%) vs Single-Pass A (55%) &amp; Budget B2 (45%)</text>
    </g>
  </g>
</svg>
